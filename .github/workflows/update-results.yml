name: Update Match Results

on:
  schedule:
    - cron: '15 16 * * *'   # 10:15 Guatemala (UTC-6)
    - cron: '15 20 * * *'   # 14:15 Guatemala (UTC-6)
    - cron: '15 2 * * *'    # 20:15 Guatemala (UTC-6)
    - cron: '15 5 * * *'    # 23:15 Guatemala (UTC-6)
  workflow_dispatch:         # manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Populate new bracket matches
        run: python scripts/populate_matches.py
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}

      - name: Update results
        run: python scripts/update_results.py
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
